name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run a check
        run: echo "Running tests..." && exit 0
      - name: Use a secret
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: echo "Secret loaded, length is ${#MY_SECRET}"
